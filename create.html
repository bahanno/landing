<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="feed.html" class="nav-logo">BAHANNO</a>
            <div class="nav-links">
                <a href="feed.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Cancel</a>
            </div>
        </div>
    </nav>

    <section class="feed-section">
        <div class="container feed-layout">
            <div class="create-post-card">
                <div class="post-tabs">
                    <button class="tab-btn active" data-type="video">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                        Video Post (Auto-slide)
                    </button>
                    <button class="tab-btn" data-type="image">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        Image Post (Swipe)
                    </button>
                </div>

                <div class="upload-area" id="upload-area">
                    <input type="file" id="image-input" accept="image/*" multiple hidden>
                    <label for="image-input" class="upload-label" id="upload-label">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <span>Select Images (Max <span id="max-img-text">3</span>)</span>
                    </label>
                    <div id="preview-container" class="preview-container"></div>
                </div>

                <textarea id="post-content" placeholder="Write a caption..." maxlength="280"></textarea>
                
                <div class="post-actions">
                    <span id="char-count">0/280</span>
                    <button id="post-btn" class="primary-btn">Post</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="feed.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="create.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Create</span>
        </a>
        <a href="#" class="nav-item" id="nav-chats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Chats</span>
        </a>
    </nav>

    <script type="module" src="create.js"></script>
</body>
</html>
