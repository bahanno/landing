<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
        }
    </script>
</head>
<body>

    <nav class="navbar" style="padding: 0.8rem 0;">
        <div class="nav-container" style="justify-content: flex-start; gap: 15px;">
            <a href="chats.html" style="color: var(--text-main); display: flex; align-items: center; text-decoration: none;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <img id="chat-header-avatar" src="" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;">
            <div style="display: flex; flex-direction: column;">
                <strong id="chat-header-name" style="color: var(--text-main); font-size: 0.95rem; line-height: 1.2;">Chat</strong>
                <span style="color: var(--text-muted); font-size: 0.75rem;">Active now</span>
            </div>
        </div>
    </nav>

    <section class="chat-room-section">
        <div class="chat-messages" id="chat-messages">
            <div class="loading-text">Loading messages...</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Message..." autocomplete="off">
            <button id="send-msg-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
        </div>
    </section>

    <script type="module">
        import { app } from './firebase-config.js';
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const urlParams = new URLSearchParams(window.location.search);
        const otherUid = urlParams.get('uid');
        
        let currentUid = null;
        let chatId = null;

        const messagesContainer = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-msg-btn');
        const headerName = document.getElementById('chat-header-name');
        const headerAvatar = document.getElementById('chat-header-avatar');

        function generateAvatar(name) {
            let initial = name ? name.trim().charAt(0).toUpperCase() : 'A';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#121317"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-style="italic" font-size="60" fill="#FFFFFF">${initial}</text></svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        onAuthStateChanged(auth, async (user) => {
            if(!user || !otherUid) { window.location.href = "chats.html"; return; }
            currentUid = user.uid;
            
            chatId = [currentUid, otherUid].sort().join('_');

            const otherDoc = await getDoc(doc(db, "users", otherUid));
            if(otherDoc.exists()) {
                const otherName = otherDoc.data().displayName || otherDoc.data().username;
                headerName.innerText = otherName;
                headerAvatar.src = otherDoc.data().photoURL || generateAvatar(otherName);
            }

            loadMessages();
        });

        function loadMessages() {
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
            
            onSnapshot(q, (snapshot) => {
                messagesContainer.innerHTML = '';
                
                if(snapshot.empty) {
                    messagesContainer.innerHTML = '<div class="empty-text" style="margin:auto; font-size:0.9rem;">Send a message to start the conversation.</div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const isMine = msg.senderId === currentUid;
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message-bubble ${isMine ? 'my-message' : 'their-message'}`;
                    msgDiv.innerText = msg.text;
                    messagesContainer.appendChild(msgDiv);
                });
                
                // Auto-scroll to bottom
                setTimeout(() => { messagesContainer.scrollTop = messagesContainer.scrollHeight; }, 50);
            });
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if(!text) return;
            
            chatInput.value = '';
            
            try {
                await addDoc(collection(db, "chats", chatId, "messages"), {
                    text: text,
                    senderId: currentUid,
                    createdAt: serverTimestamp()
                });

                await setDoc(doc(db, "chats", chatId), {
                    users: [currentUid, otherUid],
                    lastMessage: text,
                    updatedAt: serverTimestamp()
                }, { merge: true });
                
            } catch (e) {
                console.error("Error sending message: ", e);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
