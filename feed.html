<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">BAHANNO</a>
            <div class="nav-links">
                <span id="user-email" style="color: var(--text-muted); font-size: 0.9rem;"></span>
                <button id="logout-btn" class="nav-btn" style="cursor: pointer; border: none;">Logout</button>
            </div>
        </div>
    </nav>

    <section class="feed-section">
        <div class="container feed-layout">
            
            <!-- Create Post Area -->
            <div class="create-post-card">
                <h2>Create a new post</h2>
                
                <!-- Image Upload Area -->
                <div class="upload-area" id="upload-area">
                    <input type="file" id="image-input" accept="image/*" hidden>
                    <label for="image-input" class="upload-label">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                        <span>Select Image</span>
                    </label>
                    <img id="image-preview" class="image-preview" style="display: none;">
                </div>

                <textarea id="post-content" placeholder="Write a caption..." maxlength="280"></textarea>
                
                <div class="post-actions">
                    <span id="char-count">0/280</span>
                    <button id="post-btn" class="primary-btn">Post</button>
                </div>
            </div>

            <!-- Feed Area -->
            <div id="feed-container" class="feed-container">
                <div class="loading-text">Loading posts...</div>
            </div>

        </div>
    </section>

    <script src="supabase-client.js"></script>
    <script src="feed.js"></script>
</body>
</html>
