<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">BAHANNO</a>
            <div class="nav-links">
                <span id="user-email" style="color: var(--text-muted); font-size: 0.9rem;"></span>
                <button id="logout-btn" class="nav-btn" style="cursor: pointer; border: none;">Logout</button>
            </div>
        </div>
    </nav>

    <section class="feed-section">
        <div class="container feed-layout">
            
            <!-- Create Post Area -->
            <div class="create-post-card">
                
                <!-- Tabs -->
                <div class="post-tabs">
                    <button class="tab-btn active" data-type="video">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                        Video Post (Auto-slide)
                    </button>
                    <button class="tab-btn" data-type="image">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        Image Post (Swipe)
                    </button>
                </div>

                <!-- Upload Area -->
                <div class="upload-area" id="upload-area">
                    <input type="file" id="image-input" accept="image/*" multiple hidden>
                    <label for="image-input" class="upload-label" id="upload-label">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <span>Select Images (Max <span id="max-img-text">3</span>)</span>
                    </label>
                    <div id="preview-container" class="preview-container"></div>
                </div>

                <textarea id="post-content" placeholder="Write a caption..." maxlength="280"></textarea>
                
                <div class="post-actions">
                    <span id="char-count">0/280</span>
                    <button id="post-btn" class="primary-btn">Post</button>
                </div>
            </div>

            <!-- Feed Area -->
            <div id="feed-container" class="feed-container">
                <div class="loading-text">Loading posts...</div>
            </div>

        </div>
    </section>

    <script src="supabase-client.js"></script>
    <script src="feed.js"></script>
</body>
</html>
