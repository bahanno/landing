<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">BAHANNO</a>
            <div class="nav-links" style="display: flex; align-items: center;">
                <span id="user-email" style="color: var(--text-muted); font-size: 0.9rem;"></span>
                <a href="search.html" class="nav-icon-btn" style="color: var(--text-muted); text-decoration: none; margin-right: 1rem; display: flex; align-items: center; justify-content: center;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </a>
                <button id="logout-btn" class="nav-btn" style="cursor: pointer; border: none;">Logout</button>
            </div>
        </div>
    </nav>

    <section class="feed-section">
        <div class="container feed-layout">
            <div id="feed-container" class="feed-container">
                <div class="loading-text">Loading feed...</div>
            </div>
        </div>
    </section>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="feed.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" id="nav-create">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Create</span>
        </a>
        
        <a href="#" class="nav-item" id="nav-chats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Chats</span>
        </a>
        <!-- New Profile Nav Item -->
        <a href="profile.html" class="nav-item" id="nav-profile">
            <img id="nav-profile-avatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff" class="nav-avatar-img">
            <span>Profile</span>
        </a>
    </nav>

    <!-- Create Post Modal -->
    <div id="create-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <div class="modal-header">
                <h2>Create New Post</h2>
                <p>Create amazing posts for your socials</p>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Brief description</label>
                    <textarea id="post-content" placeholder="Type something..." maxlength="280"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Tone of voice</label>
                        <select class="custom-select">
                            <option>Casual</option>
                            <option>Professional</option>
                        </select>
                    </div>
                    <div class="form-group half">
                        <label>Post type</label>
                        <select id="post-type" class="custom-select">
                            <option value="image">Image Post (Swipe)</option>
                            <option value="video">Video Post (Auto-slide)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Add media</label>
                    <div class="drag-drop-area" id="drop-zone">
                        <input type="file" id="image-input" accept="image/*" multiple hidden>
                        <div class="drop-content">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
                            <p>Choose a file or drag & drop it here</p>
                            <span>Maximum size: 25MB</span>
                        </div>
                        <div id="preview-container" class="preview-container"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="post-btn" class="generate-btn">Generate post</button>
            </div>
        </div>
    </div>

    <script type="module" src="feed.js"></script>
</body>
</html>
