<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feed — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
        }
    </script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="feed.html" class="nav-logo">BAHANNO</a>
            <div class="nav-links" style="display: flex; align-items: center; gap: 15px;">
                <a href="search.html" class="nav-icon-btn" style="color: var(--text-main); text-decoration: none; display: flex; align-items: center; justify-content: center;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 24px; height: 24px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </a>
            </div>
        </div>
    </nav>

    <section class="feed-section">
        <div class="container feed-layout">
            <div id="feed-container" class="feed-container">
                <!-- Skeleton loaders will be injected here -->
            </div>
        </div>
    </section>

    <!-- Create Post Modal -->
    <div id="create-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <div class="modal-header">
                <h2>Create New Post</h2>
                <p>Share a moment with the world</p>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <textarea id="post-content" placeholder="What's on your mind?..." maxlength="280"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group half">
                        <label>Post type</label>
                        <select id="post-type" class="custom-select">
                            <option value="image">Image Post (Swipe)</option>
                            <option value="video">Video Post (Auto-slide)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <div class="drag-drop-area" id="drop-zone">
                        <input type="file" id="image-input" accept="image/*" multiple hidden>
                        <div class="drop-content">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            <p>Tap to select photos</p>
                        </div>
                        <div id="preview-container" class="preview-container"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="post-btn" class="generate-btn">Publish Post</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar (No Search Here) -->
    <nav class="bottom-nav">
        <a href="feed.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" id="nav-create">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Create</span>
        </a>
        <a href="chats.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Chats</span>
        </a>
        <a href="profile.html" class="nav-item">
            <img id="nav-profile-avatar" src="" class="nav-avatar-img">
            <span>Profile</span>
        </a>
    </nav>

    <script type="module" src="feed.js"></script>
</body>
</html>
