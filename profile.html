<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="feed.html" class="nav-logo">BAHANNO</a>
        </div>
    </nav>
    <section class="feed-section">
        <div class="container feed-layout">
            <div class="profile-header" style="text-align:center; padding: 4rem 0;">
                <img id="profile-avatar" src="" style="width: 120px; height: 120px; border-radius: 50%; margin-bottom: 1rem; border: 2px solid rgba(255,255,255,0.1);">
                <h2 id="profile-name" style="color: white; font-size: 2rem;">Loading...</h2>
                <p id="profile-username" style="color: var(--text-muted); font-size: 1.1rem;">@username</p>
                <a href="feed.html" class="primary-btn" style="margin-top: 2rem;">Back to Feed</a>
            </div>
        </div>
    </section>
    <script type="module">
        import { app } from './firebase-config.js';
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Sleek SVG Avatar Generator
        function generateAvatar(name) {
            let initial = 'A';
            if (name && name.trim().length > 0) initial = name.trim().charAt(0).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#121317"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-style="italic" font-size="60" fill="#FFFFFF">${initial}</text></svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        onAuthStateChanged(auth, async (user) => {
            if(!user) window.location.href = "login.html";
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if(userDoc.exists()){
                const data = userDoc.data();
                document.getElementById('profile-name').innerText = data.displayName;
                document.getElementById('profile-username').innerText = "@" + data.username;
                document.getElementById('profile-avatar').src = generateAvatar(data.displayName || data.username);
            }
        });
    </script>
</body>
</html>
