<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="feed.html" class="nav-logo">BAHANNO</a>
            <div class="nav-links">
                <a href="feed.html" class="nav-btn">Back to Feed</a>
            </div>
        </div>
    </nav>

    <section class="profile-section">
        <div class="container profile-container">
            
            <!-- Cover & Avatar Area -->
            <div class="profile-header">
                <div class="cover-photo"></div>
                <div class="profile-avatar-wrapper">
                    <img id="profile-avatar" src="" class="profile-avatar-large">
                </div>
            </div>

            <!-- Profile Info -->
            <div class="profile-info">
                <h2 id="profile-name">Loading...</h2>
                <p id="profile-username">@username</p>
                <p id="profile-bio" style="margin-bottom: 1.5rem; font-size: 0.95rem;"></p>
                
                <div class="profile-stats">
                    <div class="stat-box"><strong id="post-count">0</strong><span>Posts</span></div>
                    <div class="stat-box"><strong>0</strong><span>Followers</span></div>
                    <div class="stat-box"><strong>0</strong><span>Following</span></div>
                </div>

                <div id="edit-profile-action" style="display: none; margin-top: 1.5rem;">
                    <button id="open-edit-btn" class="secondary-btn">Edit Profile</button>
                </div>
            </div>

            <!-- User Posts -->
            <div class="user-posts-section">
                <h3 class="section-title-small">Posts</h3>
                <div id="user-posts-grid" class="user-posts-grid">
                    <div class="loading-text">Loading posts...</div>
                </div>
            </div>

        </div>
    </section>

    <!-- Premium Edit Profile Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-edit-modal">&times;</button>
            
            <div class="modal-header" style="text-align: center;">
                <h2>Edit Profile</h2>
                <p>Update your personal information</p>
            </div>
            
            <div class="modal-body">
                <!-- Custom Avatar Uploader -->
                <div class="avatar-upload-container">
                    <div class="avatar-preview-wrapper">
                        <img id="avatar-preview" src="" alt="Preview">
                        <label for="edit-image" class="camera-icon-overlay">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        </label>
                    </div>
                    <input type="file" id="edit-image" accept="image/*" hidden>
                    <span class="upload-hint">Tap to change picture</span>
                </div>

                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="edit-name" class="custom-input" placeholder="John Doe" maxlength="30">
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label>Bio</label>
                        <span id="bio-count">0/150</span>
                    </div>
                    <textarea id="edit-bio" placeholder="Tell us about yourself..." maxlength="150"></textarea>
                </div>
            </div>
            
            <div class="modal-footer">
                <button id="save-profile-btn" class="generate-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="feed.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="feed.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Create</span>
        </a>
        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Chats</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <img id="nav-profile-avatar" src="" class="nav-avatar-img">
            <span>Profile</span>
        </a>
    </nav>

    <script type="module">
        import { app } from './firebase-config.js';
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const auth = getAuth(app);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "e022a522bf0d1a4887e182d4aea38c17"; // Ensure your API key is here

        const urlParams = new URLSearchParams(window.location.search);
        const targetUid = urlParams.get('uid');
        
        let currentUid = null;
        let profileUid = null;
        let selectedFile = null;

        const editModal = document.getElementById('edit-modal');
        const openEditBtn = document.getElementById('open-edit-btn');
        const closeEditModal = document.getElementById('close-edit-modal');
        const saveProfileBtn = document.getElementById('save-profile-btn');
        
        // Modal Elements
        const avatarPreview = document.getElementById('avatar-preview');
        const editImageInput = document.getElementById('edit-image');
        const editNameInput = document.getElementById('edit-name');
        const editBioInput = document.getElementById('edit-bio');
        const bioCount = document.getElementById('bio-count');

        function generateAvatar(name) {
            let initial = 'A';
            if (name && name.trim().length > 0) initial = name.trim().charAt(0).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#121317"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-style="italic" font-size="60" fill="#FFFFFF">${initial}</text></svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        onAuthStateChanged(auth, async (user) => {
            if(!user) { window.location.href = "login.html"; return; }
            currentUid = user.uid;
            profileUid = targetUid || currentUid;

            const myDoc = await getDoc(doc(db, "users", currentUid));
            let myName = user.email.split('@')[0];
            if(myDoc.exists() && myDoc.data().displayName) myName = myDoc.data().displayName;
            document.getElementById('nav-profile-avatar').src = myDoc.exists() && myDoc.data().photoURL ? myDoc.data().photoURL : generateAvatar(myName);

            await loadProfileData(profileUid);
            
            if (profileUid === currentUid) {
                document.getElementById('edit-profile-action').style.display = 'block';
            }
        });

        async function loadProfileData(uid) {
            const userDoc = await getDoc(doc(db, "users", uid));
            if(!userDoc.exists()) return;

            const data = userDoc.data();
            const displayName = data.displayName || "Bahanno User";
            const avatarSrc = data.photoURL ? data.photoURL : generateAvatar(displayName);

            document.getElementById('profile-name').innerText = displayName;
            document.getElementById('profile-username').innerText = "@" + (data.username || "user");
            document.getElementById('profile-bio').innerText = data.bio || "No bio yet.";
            document.getElementById('profile-avatar').src = avatarSrc;

            // Populate edit modal
            editNameInput.value = displayName;
            editBioInput.value = data.bio || "";
            bioCount.innerText = `${editBioInput.value.length}/150`;
            avatarPreview.src = avatarSrc;
            selectedFile = null; // reset on load

            loadUserPosts(uid);
        }

        async function loadUserPosts(userId) {
            const grid = document.getElementById('user-posts-grid');
            const q = query(collection(db, "posts"), where("userId", "==", userId));
            try {
                const snapshot = await getDocs(q);
                document.getElementById('post-count').innerText = snapshot.size;
                grid.innerHTML = '';
                if(snapshot.empty) {
                    grid.innerHTML = '<div class="empty-text">No posts yet.</div>';
                    return;
                }
                snapshot.forEach(doc => {
                    const post = doc.data();
                    const el = document.createElement('div');
                    el.className = 'user-post-thumb';
                    el.innerHTML = post.images && post.images.length > 0 ? `<img src="${post.images[0]}">` : `<div class="text-post-thumb">${post.content.substring(0, 30)}...</div>`;
                    grid.appendChild(el);
                });
            } catch(error) { grid.innerHTML = '<div class="error-text">Error loading posts.</div>'; }
        }

        // Modal Logic
        openEditBtn.addEventListener('click', () => editModal.classList.add('active'));
        closeEditModal.addEventListener('click', () => editModal.classList.remove('active'));
        editModal.addEventListener('click', (e) => { if(e.target === editModal) editModal.classList.remove('active'); });

        // Character counter for Bio
        editBioInput.addEventListener('input', () => {
            bioCount.innerText = `${editBioInput.value.length}/150`;
        });

        // Image Preview Logic
        editImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    avatarPreview.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        saveProfileBtn.addEventListener('click', async () => {
            const newName = editNameInput.value.trim();
            const newBio = editBioInput.value.trim();
            
            if(!newName) return alert("Name cannot be empty.");
            
            saveProfileBtn.innerText = "Saving...";
            saveProfileBtn.disabled = true;
            
            try {
                let updates = { displayName: newName, bio: newBio };

                if(selectedFile) {
                    const formData = new FormData();
                    formData.append('image', selectedFile);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                    const imgData = await res.json();
                    if(imgData.success) updates.photoURL = imgData.data.url;
                }

                await updateDoc(doc(db, "users", currentUid), updates);
                window.location.reload();
            } catch (error) {
                alert("Error saving: " + error.message);
                saveProfileBtn.innerText = "Save Changes";
                saveProfileBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
