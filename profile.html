<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0B10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BAHANNO">
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered!'))
                .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>

</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="feed.html" class="nav-logo">BAHANNO</a>
            <div class="nav-links" style="display: flex; align-items: center; gap: 15px;">
                <a href="feed.html" class="nav-btn" style="padding: 0.5rem 1rem; font-size: 0.85rem;">Back</a>
                <button id="settings-btn" class="nav-icon-btn" style="background: transparent; border: none; cursor: pointer; color: var(--text-main);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 24px; height: 24px;"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <section class="profile-section">
        <div class="container profile-container">
            <div class="profile-header">
                <div class="cover-photo"></div>
                <div class="profile-avatar-wrapper">
                    <img id="profile-avatar" src="" class="profile-avatar-large">
                </div>
            </div>

            <div class="profile-info">
                <h2 id="profile-name">Loading...</h2>
                <p id="profile-username">@username</p>
                <p id="profile-bio" style="margin-bottom: 1.5rem; font-size: 0.95rem;"></p>
                
                <div class="profile-stats">
                    <div class="stat-box"><strong id="post-count">0</strong><span>Posts</span></div>
                    <div class="stat-box"><strong id="follower-count">0</strong><span>Followers</span></div>
                    <div class="stat-box"><strong id="following-count">0</strong><span>Following</span></div>
                </div>

                <div style="margin-top: 1.5rem;">
                    <button id="open-edit-btn" class="secondary-btn" style="display: none;">Edit Profile</button>
                    <div id="other-actions" style="display: none; gap: 10px; justify-content: center;">
                        <button id="follow-btn" class="primary-btn">Follow</button>
                        <a href="#" id="message-btn" class="secondary-btn" style="text-decoration: none;">Message</a>
                    </div>
                </div>
            </div>

            <!-- Profile Tabs -->
            <div class="profile-tabs" id="profile-tabs" style="display: none; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 1.5rem;">
                <button class="profile-tab active" id="tab-posts" style="flex:1; padding: 1rem; background:transparent; border:none; color:white; border-bottom: 2px solid white; font-weight:600; cursor:pointer;">My Posts</button>
                <button class="profile-tab" id="tab-saved" style="flex:1; padding: 1rem; background:transparent; border:none; color:gray; border-bottom: 2px solid transparent; font-weight:600; cursor:pointer;">Saved</button>
            </div>

            <div class="user-posts-section">
                <div id="user-posts-grid" class="user-posts-grid">
                    <div class="loading-text">Loading posts...</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px;">
            <button class="close-modal" id="close-settings-modal">&times;</button>
            <div class="modal-header" style="text-align: center;">
                <h2>Settings</h2>
                <p>Manage your account</p>
            </div>
            <div class="modal-body" style="padding: 2rem 0 1rem 0;">
                <button id="logout-btn" class="dropdown-item" style="color: #ef4444; text-align: center; border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; padding: 1rem; font-weight: 600; width: 100%;">Logout</button>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-edit-modal">&times;</button>
            <div class="modal-header" style="text-align: center;">
                <h2>Edit Profile</h2>
                <p>Update your personal information</p>
            </div>
            <div class="modal-body">
                <div class="avatar-upload-container">
                    <div class="avatar-preview-wrapper">
                        <img id="avatar-preview" src="" alt="Preview">
                        <label for="edit-image" class="camera-icon-overlay">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        </label>
                    </div>
                    <input type="file" id="edit-image" accept="image/*" hidden>
                    <span class="upload-hint">Tap to change picture</span>
                </div>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="edit-name" class="custom-input" placeholder="John Doe" maxlength="30">
                </div>
                <div class="form-group">
                    <div class="label-row">
                        <label>Bio</label>
                        <span id="bio-count">0/150</span>
                    </div>
                    <textarea id="edit-bio" placeholder="Tell us about yourself..." maxlength="150"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-profile-btn" class="generate-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="feed.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="search.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Search</span>
        </a>
        <a href="feed.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Create</span>
        </a>
        <a href="chats.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Chats</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <img id="nav-profile-avatar" src="" class="nav-avatar-img">
            <span>Profile</span>
        </a>
    </nav>

    <script type="module">
        import { app } from './firebase-config.js';
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, query, where, getDocs, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const auth = getAuth(app);
        const db = getFirestore(app);
        const IMGBB_API_KEY = "e022a522bf0d1a4887e182d4aea38c17"; 

        const urlParams = new URLSearchParams(window.location.search);
        const targetUid = urlParams.get('uid');
        
        let currentUid = null;
        let profileUid = null;
        let selectedFile = null;
        let isFollowing = false;
        let userSavedPosts = [];

        // Settings Modal
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsModal = document.getElementById('close-settings-modal');
        const logoutBtn = document.getElementById('logout-btn');

        if(settingsBtn) {
            settingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
            closeSettingsModal.addEventListener('click', () => settingsModal.classList.remove('active'));
            settingsModal.addEventListener('click', (e) => { if(e.target === settingsModal) settingsModal.classList.remove('active'); });
            logoutBtn.addEventListener('click', () => { signOut(auth).then(() => { window.location.href = "index.html"; }); });
        }

        const followBtn = document.getElementById('follow-btn');
        const editModal = document.getElementById('edit-modal');
        const openEditBtn = document.getElementById('open-edit-btn');
        const closeEditModal = document.getElementById('close-edit-modal');
        const saveProfileBtn = document.getElementById('save-profile-btn');
        const avatarPreview = document.getElementById('avatar-preview');
        const editImageInput = document.getElementById('edit-image');
        const editNameInput = document.getElementById('edit-name');
        const editBioInput = document.getElementById('edit-bio');
        const bioCount = document.getElementById('bio-count');

        // Tabs
        const tabPosts = document.getElementById('tab-posts');
        const tabSaved = document.getElementById('tab-saved');
        const profileTabs = document.getElementById('profile-tabs');

        function generateAvatar(name) {
            let initial = 'A';
            if (name && name.trim().length > 0) initial = name.trim().charAt(0).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#121317"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-style="italic" font-size="60" fill="#FFFFFF">${initial}</text></svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        onAuthStateChanged(auth, async (user) => {
            if(!user) { window.location.href = "login.html"; return; }
            currentUid = user.uid;
            profileUid = targetUid || currentUid;

            const myDoc = await getDoc(doc(db, "users", currentUid));
            let myName = user.email.split('@')[0];
            if(myDoc.exists() && myDoc.data().displayName) myName = myDoc.data().displayName;
            document.getElementById('nav-profile-avatar').src = myDoc.exists() && myDoc.data().photoURL ? myDoc.data().photoURL : generateAvatar(myName);

            await loadProfileData(profileUid);
        });

        async function loadProfileData(uid) {
            const userDoc = await getDoc(doc(db, "users", uid));
            if(!userDoc.exists()) return;

            const data = userDoc.data();
            const displayName = data.displayName || "Bahanno User";
            const avatarSrc = data.photoURL ? data.photoURL : generateAvatar(displayName);
            userSavedPosts = data.savedPosts || [];

            document.getElementById('profile-name').innerText = displayName;
            document.getElementById('profile-username').innerText = "@" + (data.username || "user");
            document.getElementById('profile-bio').innerText = data.bio || "No bio yet.";
            document.getElementById('profile-avatar').src = avatarSrc;

            const followers = data.followers || [];
            const following = data.following || [];
            document.getElementById('follower-count').innerText = followers.length;
            document.getElementById('following-count').innerText = following.length;

            editNameInput.value = displayName;
            editBioInput.value = data.bio || "";
            bioCount.innerText = `${editBioInput.value.length}/150`;
            avatarPreview.src = avatarSrc;
            selectedFile = null;

            if (uid === currentUid) {
                openEditBtn.style.display = 'inline-block';
                document.getElementById('other-actions').style.display = 'none';
                profileTabs.style.display = 'flex'; // Show tabs for own profile
            } else {
                openEditBtn.style.display = 'none';
                document.getElementById('other-actions').style.display = 'flex';
                document.getElementById('message-btn').href = 'chat-room.html?uid=' + profileUid;
                profileTabs.style.display = 'none'; // Hide tabs for others
                
                isFollowing = followers.includes(currentUid);
                updateFollowBtnUI();
            }

            // Default load posts
            tabPosts.style.color = "white";
            tabPosts.style.borderBottom = "2px solid white";
            tabSaved.style.color = "gray";
            tabSaved.style.borderBottom = "2px solid transparent";
            loadUserPosts(uid);
        }

        // Tab Logic
        tabPosts.addEventListener('click', () => {
            tabPosts.style.color = "white"; tabPosts.style.borderBottom = "2px solid white";
            tabSaved.style.color = "gray"; tabSaved.style.borderBottom = "2px solid transparent";
            loadUserPosts(profileUid);
        });

        tabSaved.addEventListener('click', () => {
            tabSaved.style.color = "white"; tabSaved.style.borderBottom = "2px solid white";
            tabPosts.style.color = "gray"; tabPosts.style.borderBottom = "2px solid transparent";
            loadSavedPosts();
        });

        async function loadSavedPosts() {
            const grid = document.getElementById('user-posts-grid');
            grid.innerHTML = '<div class="loading-text">Loading saved posts...</div>';
            
            if(userSavedPosts.length === 0) {
                grid.innerHTML = '<div class="empty-text">No saved posts yet.</div>';
                return;
            }

            grid.innerHTML = '';
            for(const postId of userSavedPosts) {
                const postDoc = await getDoc(doc(db, "posts", postId));
                if(postDoc.exists()) {
                    const post = postDoc.data();
                    const el = document.createElement('div');
                    el.className = 'user-post-thumb';
                    el.innerHTML = post.images && post.images.length > 0 ? `<img src="${post.images[0]}">` : `<div class="text-post-thumb">${post.content.substring(0, 30)}...</div>`;
                    grid.appendChild(el);
                }
            }
        }

        function updateFollowBtnUI() {
            if(isFollowing) {
                followBtn.innerText = "Following"; followBtn.style.background = "transparent"; followBtn.style.color = "var(--text-main)"; followBtn.style.border = "1px solid rgba(255,255,255,0.3)";
            } else {
                followBtn.innerText = "Follow"; followBtn.style.background = "var(--text-main)"; followBtn.style.color = "var(--bg-color)"; followBtn.style.border = "none";
            }
        }

        followBtn.addEventListener('click', async () => {
            followBtn.disabled = true;
            const targetRef = doc(db, "users", profileUid); const myRef = doc(db, "users", currentUid);
            try {
                if (isFollowing) {
                    await updateDoc(targetRef, { followers: arrayRemove(currentUid) });
                    await updateDoc(myRef, { following: arrayRemove(profileUid) });
                    isFollowing = false;
                } else {
                    await updateDoc(targetRef, { followers: arrayUnion(currentUid) });
                    await updateDoc(myRef, { following: arrayUnion(profileUid) });
                    isFollowing = true;
                }
                updateFollowBtnUI(); loadProfileData(profileUid); 
            } catch(e) { alert("Error updating follow status."); } finally { followBtn.disabled = false; }
        });

        async function loadUserPosts(userId) {
            const grid = document.getElementById('user-posts-grid');
            const q = query(collection(db, "posts"), where("userId", "==", userId));
            try {
                const snapshot = await getDocs(q);
                document.getElementById('post-count').innerText = snapshot.size;
                grid.innerHTML = '';
                if(snapshot.empty) { grid.innerHTML = '<div class="empty-text">No posts yet.</div>'; return; }
                snapshot.forEach(doc => {
                    const post = doc.data();
                    const el = document.createElement('div');
                    el.className = 'user-post-thumb';
                    el.innerHTML = post.images && post.images.length > 0 ? `<img src="${post.images[0]}">` : `<div class="text-post-thumb">${post.content.substring(0, 30)}...</div>`;
                    grid.appendChild(el);
                });
            } catch(error) { grid.innerHTML = '<div class="error-text">Error loading posts.</div>'; }
        }

        // Edit Modal
        openEditBtn.addEventListener('click', () => editModal.classList.add('active'));
        closeEditModal.addEventListener('click', () => editModal.classList.remove('active'));
        editModal.addEventListener('click', (e) => { if(e.target === editModal) editModal.classList.remove('active'); });
        editBioInput.addEventListener('input', () => { bioCount.innerText = `${editBioInput.value.length}/150`; });
        editImageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => { avatarPreview.src = e.target.result; };
                reader.readAsDataURL(file);
            }
        });

        saveProfileBtn.addEventListener('click', async () => {
            const newName = editNameInput.value.trim(); const newBio = editBioInput.value.trim();
            if(!newName) return alert("Name cannot be empty.");
            saveProfileBtn.innerText = "Saving..."; saveProfileBtn.disabled = true;
            try {
                let updates = { displayName: newName, bio: newBio };
                if(selectedFile) {
                    const formData = new FormData(); formData.append('image', selectedFile);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                    const imgData = await res.json();
                    if(imgData.success) updates.photoURL = imgData.data.url;
                }
                await updateDoc(doc(db, "users", currentUid), updates);
                window.location.reload();
            } catch (error) { alert("Error: " + error.message); saveProfileBtn.innerText = "Save Changes"; saveProfileBtn.disabled = false; }
        });
    </script>
</body>
</html>
