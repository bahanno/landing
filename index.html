<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHANNO AI — Your Bangladeshi Assistant</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

    <header class="chat-header">
        <h1 class="brand-name">BAHANNO AI</h1>
        <p class="status">Powered by Gemini • Online</p>
    </header>

    <!-- Chat Area -->
    <main class="chat-container" id="chatContainer">
        <!-- Initial Bot Message -->
        <div class="message bot-message">
            <div class="avatar">B</div>
            <div class="bubble">
                আসসালামু আলাইকুম! আমি BAHANNO AI। তোমাকে কীভাবে সাহায্য করতে পারি? পড়াশোনা, প্রোগ্রামিং, নাকি ইনকাম নিয়ে জানতে চাও?
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <div class="input-container">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Ask me anything..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
