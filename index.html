<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHANNO AI — Your Bangladeshi Assistant</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="chat-header">
        <h1 class="brand-name">BAHANNO AI</h1>
        <p class="status">Global AI Assistant • Powered by Gemini</p>
    </header>

    <!-- Chat Area -->
    <main class="chat-container" id="chatContainer">
<!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <h2 class="welcome-title">How can I help you today?</h2>
            <p class="welcome-subtitle">Ask anything. I speak your language.</p>
            
            <div class="suggestions-grid">
                <div class="suggestion-card" onclick="useSuggestion('How to start freelancing in 2024?')">
                    <span class="icon">💼</span>
                    <p>How to start freelancing?</p>
                </div>
                <div class="suggestion-card" onclick="useSuggestion('Explain HTML in simple terms.')">
                    <span class="icon">💻</span>
                    <p>Explain HTML simply</p>
                </div>
                <div class="suggestion-card" onclick="useSuggestion('Write a short story about a robot.')">
                    <span class="icon">✍️</span>
                    <p>Write a short story</p>
                </div>
                <div class="suggestion-card" onclick="useSuggestion('How to use AI to make money online?')">
                    <span class="icon">🚀</span>
                    <p>How to earn using AI?</p>
                </div>
            </div>
        </div>
        
        
    </main>

    <!-- Input Area -->
    <div class="input-container">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Message BAHANNO AI..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="supabase-client.js"></script>
    <script src="script.js"></script>
</body>
</html>
