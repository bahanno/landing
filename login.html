<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .divider { display: flex; align-items: center; text-align: center; margin: 1.5rem 0; color: var(--text-muted); }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }
        .google-btn { width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; background: #ffffff; color: #000000; border: none; padding: 0.9rem; border-radius: 50px; cursor: pointer; font-weight: 600; transition: 0.3s; font-size: 1rem; }
        .google-btn:hover { background: #f0f0f0; }
        .username-status { font-size: 0.8rem; margin-top: 0.3rem; display: none; }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0B10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BAHANNO">
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered!'))
                .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>

</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">BAHANNO</a>
        </div>
    </nav>
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <h2 class="auth-title">Welcome to Bahanno</h2>
                <p class="auth-subtitle">Join the community. Share your world.</p>
                
                <form id="auth-form">
                    <!-- Display Name (Only visible in Sign Up) -->
                    <div class="input-group" id="name-group" style="display: none;">
                        <label for="displayName">Full Name</label>
                        <input type="text" id="displayName" placeholder="John Doe">
                    </div>

                    <!-- Username Field (Only visible in Sign Up) -->
                    <div class="input-group" id="username-group" style="display: none;">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="@username" autocapitalize="none">
                        <div id="username-status" class="username-status"></div>
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" id="submit-btn" class="primary-btn w-100">Log In</button>
                </form>

                <div class="divider">OR</div>

                <button id="google-btn" class="google-btn">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20" alt="Google">
                    Continue with Google
                </button>

                <p class="auth-toggle">
                    Don't have an account? <a href="#" id="toggle-auth">Sign Up</a>
                </p>
                <div id="auth-message" class="auth-message"></div>
            </div>
        </div>
    </section>
    
    <script type="module" src="auth.js"></script>
</body>
</html>
