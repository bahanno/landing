<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .divider { display: flex; align-items: center; text-align: center; margin: 1.5rem 0; color: var(--text-muted); }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }
        .google-btn { width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; background: transparent; color: var(--text-main); border: 1px solid rgba(255,255,255,0.2); padding: 0.8rem; border-radius: 50px; cursor: pointer; font-weight: 500; transition: 0.3s; }
        .google-btn:hover { background: rgba(255,255,255,0.05); }
        .username-status { font-size: 0.8rem; margin-top: 0.3rem; display: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">BAHANNO</a>
        </div>
    </nav>
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <h2 class="auth-title">Welcome to Bahanno</h2>
                <p class="auth-subtitle">Join the community. Share your world.</p>
                
                <form id="auth-form">
                    <!-- Username Field (Only visible in Sign Up) -->
                    <div class="input-group" id="username-group" style="display: none;">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="@username" required>
                        <div id="username-status" class="username-status"></div>
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" id="submit-btn" class="primary-btn w-100">Log In</button>
                </form>

                <div class="divider">OR</div>

                <button id="google-btn" class="google-btn">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Continue with Google
                </button>

                <p class="auth-toggle">
                    Don't have an account? <a href="#" id="toggle-auth">Sign Up</a>
                </p>
                <div id="auth-message" class="auth-message"></div>
            </div>
        </div>
    </section>
    
    <script type="module" src="auth.js"></script>
</body>
</html>
