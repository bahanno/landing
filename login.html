<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">BAHANNO</a>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">Back to Home</a>
            </div>
        </div>
    </nav>
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <h2 class="auth-title">Welcome to Bahanno</h2>
                <p class="auth-subtitle">Join the community. Share your world.</p>
                <form id="auth-form">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" id="submit-btn" class="primary-btn w-100">Log In</button>
                </form>
                <p class="auth-toggle">
                    Don't have an account? <a href="#" id="toggle-auth">Sign Up</a>
                </p>
                <div id="auth-message" class="auth-message"></div>
            </div>
        </div>
    </section>
    
    <!-- Load Auth Logic -->
    <script type="module" src="auth.js"></script>
</body>
</html>
