<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats — BAHANNO</title>
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0B10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BAHANNO">
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered!'))
                .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>

</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="feed.html" class="nav-logo">BAHANNO</a>
        </div>
    </nav>

    <section class="feed-section">
        <div class="container feed-layout">
            <div class="chat-header">
                <h2 class="section-title-small">Messages</h2>
            </div>
            <div id="chat-list" class="chat-list">
                <div class="loading-text">Loading chats...</div>
            </div>
        </div>
    </section>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="feed.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="search.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Search</span>
        </a>
        <a href="feed.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Create</span>
        </a>
        <a href="chats.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Chats</span>
        </a>
        <a href="profile.html" class="nav-item">
            <img id="nav-profile-avatar" src="" class="nav-avatar-img">
            <span>Profile</span>
        </a>
    </nav>

    <script type="module">
        import { app } from './firebase-config.js';
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const auth = getAuth(app);
        const db = getFirestore(app);
        
        function generateAvatar(name) {
            let initial = name ? name.trim().charAt(0).toUpperCase() : 'A';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#121317"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-style="italic" font-size="60" fill="#FFFFFF">${initial}</text></svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        onAuthStateChanged(auth, async (user) => {
            if(!user) { window.location.href = "login.html"; return; }
            
            const myDoc = await getDoc(doc(db, "users", user.uid));
            let myName = user.email.split('@')[0];
            if(myDoc.exists() && myDoc.data().displayName) myName = myDoc.data().displayName;
            document.getElementById('nav-profile-avatar').src = myDoc.exists() && myDoc.data().photoURL ? myDoc.data().photoURL : generateAvatar(myName);

            loadChats(user.uid);
        });

        async function loadChats(currentUid) {
            const list = document.getElementById('chat-list');
            
            // Get chats where current user is one of the participants
            const q = query(collection(db, "chats"), where("users", "array-contains", currentUid));
            
            onSnapshot(q, async (snapshot) => {
                list.innerHTML = '';
                
                if(snapshot.empty) {
                    list.innerHTML = '<div class="empty-text">No messages yet. Go to a profile and tap Message!</div>';
                    return;
                }

                // Sort manually by updatedAt if needed (Firestore might require composite index for ordering with array-contains)
                const chats = [];
                snapshot.forEach(doc => chats.push({ id: doc.id, ...doc.data() }));
                chats.sort((a, b) => (b.updatedAt?.toMillis() || 0) - (a.updatedAt?.toMillis() || 0));

                for (const chat of chats) {
                    const otherUid = chat.users.find(id => id !== currentUid);
                    if(!otherUid) continue;

                    const otherUserDoc = await getDoc(doc(db, "users", otherUid));
                    let otherName = "User";
                    let otherAvatar = generateAvatar("U");
                    
                    if(otherUserDoc.exists()) {
                        otherName = otherUserDoc.data().displayName || otherUserDoc.data().username;
                        otherAvatar = otherUserDoc.data().photoURL || generateAvatar(otherName);
                    }

                    const el = document.createElement('a');
                    el.href = `chat-room.html?uid=${otherUid}`;
                    el.className = 'chat-list-item';
                    el.innerHTML = `
                        <img src="${otherAvatar}" class="chat-avatar">
                        <div class="chat-info">
                            <div class="chat-name-row">
                                <strong>${otherName}</strong>
                                <span class="chat-time">${chat.updatedAt ? new Date(chat.updatedAt.toMillis()).toLocaleDateString() : ''}</span>
                            </div>
                            <p class="chat-preview">${chat.lastMessage || 'Tap to chat'}</p>
                        </div>
                    `;
                    list.appendChild(el);
                }
            });
        }
    </script>
</body>
</html>
